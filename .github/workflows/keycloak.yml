name: keycloak

on:
  push:
    branches: [main]
    paths:
      - 'containers/keycloak/**'
      - '.github/workflows/keycloak.yml'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'containers/keycloak/**'
      - '.github/workflows/keycloak.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Version branch to build (blank = all branches present in the repo)'
        required: false
        default: ''

jobs:
  keycloak:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      app: keycloak
      branch: ${{ inputs.branch || '' }}
