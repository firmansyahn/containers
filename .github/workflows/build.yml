name: build

# Reusable build for one app. Called by the per-app workflows, which own the
# path filters; everything below is driven by what is actually in the tree, so
# adding a version branch never needs a workflow edit.
on:
  workflow_call:
    inputs:
      app:
        description: 'Directory under containers/ to build'
        required: true
        type: string
      branch:
        description: 'Single version branch to build (blank = all present)'
        required: false
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  discover:
    name: discover version branches
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.branches.outputs.matrix }}
      latest: ${{ steps.branches.outputs.latest }}
    steps:
      - uses: actions/checkout@v7

      - id: branches
        name: List containers/${{ inputs.app }}/*/debian-12
        run: |
          set -euo pipefail
          app='${{ inputs.app }}'
          branches=$(find "containers/$app" -mindepth 2 -maxdepth 2 -type d -name debian-12 \
            | cut -d/ -f3 | sort -V)
          [ -n "$branches" ] || { echo "::error::no version branches found under containers/$app"; exit 1; }

          # :latest follows the highest APP_VERSION, not the highest directory
          # name — keycloak keeps its newest release in a branch called "26"
          # while older ones sit in "26.6" and "26.6.1".
          latest_branch=''; latest_version=''
          while read -r b; do
            v=$(grep -oP '\bAPP_VERSION="\K[^"]+' "containers/$app/$b/debian-12/Dockerfile")
            echo "  $b -> $v"
            if [ -z "$latest_version" ] || \
               [ "$(printf '%s\n%s\n' "$latest_version" "$v" | sort -V | tail -1)" = "$v" ]; then
              latest_version="$v"; latest_branch="$b"
            fi
          done <<< "$branches"
          echo "latest=$latest_branch" >> "$GITHUB_OUTPUT"

          wanted='${{ inputs.branch }}'
          if [ -n "$wanted" ]; then
            echo "$branches" | grep -qx "$wanted" || { echo "::error::branch $wanted not in repo"; exit 1; }
            branches="$wanted"
          fi

          echo "matrix=$(echo "$branches" | jq -Rsc 'split("\n") | map(select(length > 0)) | {branch: .}')" >> "$GITHUB_OUTPUT"
          echo "Building: $(echo "$branches" | tr '\n' ' ')(latest = $latest_branch)"

  build:
    name: ${{ inputs.app }} ${{ matrix.branch }}
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        name: Read version out of the Dockerfile
        run: |
          set -euo pipefail
          context="containers/${{ inputs.app }}/${{ matrix.branch }}/debian-12"
          dockerfile="$context/Dockerfile"

          # Bitnami stamps both of these into every release commit, so the tags
          # always match whatever tarball the Dockerfile actually pulls.
          app_version=$(grep -oP '\bAPP_VERSION="\K[^"]+' "$dockerfile")
          revision=$(grep -oP '\bIMAGE_REVISION="\K[^"]+' "$dockerfile")
          image="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ inputs.app }}"

          # The one piece of per-package text a monorepo can differentiate: the
          # README under it on the package page always comes from the repo root,
          # because image.source takes a repo URL and not a subdirectory.
          # Newlines are folded out — the annotation has to be a single line.
          desc_file="containers/${{ inputs.app }}/description.txt"
          [ -f "$desc_file" ] || { echo "::error::$desc_file is missing"; exit 1; }
          description=$(tr '\n' ' ' < "$desc_file" | sed 's/  */ /g; s/ *$//')
          [ -n "$description" ] || { echo "::error::$desc_file is empty"; exit 1; }
          [ "${#description}" -le 512 ] || \
            { echo "::error::description is ${#description} chars, GHCR caps it at 512"; exit 1; }

          tags="${image}:${app_version}-debian-12-r${revision}
          ${image}:${app_version}"
          # A branch pinned to one exact patch (keycloak "26.6.1") is named
          # after its version, so its branch tag is already in the list.
          if [ '${{ matrix.branch }}' != "$app_version" ]; then
            tags="${tags}
          ${image}:${{ matrix.branch }}"
          fi
          if [ '${{ matrix.branch }}' = '${{ needs.discover.outputs.latest }}' ]; then
            tags="${tags}
          ${image}:latest"
          fi

          {
            echo "context=$context"
            echo "image=$image"
            echo "app_version=$app_version"
            echo "description=$description"
            echo "test_tag=${image}:ci-${{ github.run_id }}-${{ matrix.branch }}"
            echo "tags<<EOF"
            echo "$tags" | sed 's/^ *//'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Optional: avoids anonymous Docker Hub rate limits when pulling
      # bitnami/minideb. Set the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN
      # secret on the repo to enable; skipped entirely when they are absent.
      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Normally GITHUB_TOKEN, which is what runs today: both packages grant
      # this repo Write under their Actions access settings.
      #
      # That had to be granted by hand. These packages were first pushed by the
      # Bitnami rescue rather than by Actions, so nothing linked them to this
      # repo and every push failed with "denied: permission_denied:
      # write_package" — and there is no API for the fix, only the package
      # settings page. GHCR_TOKEN (a classic PAT with write:packages) is the
      # escape hatch if that access is ever lost, or for a package created
      # outside Actions again; set the secret and it takes over.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build amd64 for smoke test
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.meta.outputs.context }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.test_tag }}
          cache-from: type=gha,scope=${{ inputs.app }}-${{ matrix.branch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}-${{ matrix.branch }}

      - name: Smoke test
        env:
          IMAGE: ${{ steps.meta.outputs.test_tag }}
          WANT: ${{ steps.meta.outputs.app_version }}
        run: |
          set -euo pipefail
          script="containers/${{ inputs.app }}/ci-smoke.sh"
          [ -x "$script" ] || { echo "::error::$script is missing or not executable"; exit 1; }
          "$script"

      - name: Build and push ${{ env.PLATFORMS }}
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.meta.outputs.context }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Links the GHCR package to this repo in the UI. description and
          # vendor are overrides: the upstream Dockerfiles label these
          # "Application packaged by Broadcom, Inc." and vendor "Broadcom,
          # Inc." — true of the tarball inside, wrong about who built and
          # publishes the image, which is whoever owns this repo.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
          # GHCR takes the package-page description from the *index*
          # annotations, not from the per-arch labels above, so a multi-arch
          # image shows no description at all unless it is set here as well.
          # vendor rides along to keep both metadata planes saying the same
          # thing, though nothing on the package page renders it.
          annotations: |
            index,manifest:org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            index,manifest:org.opencontainers.image.vendor=${{ github.repository_owner }}
          # Keep the manifest list a plain multi-arch index, like the images
          # this mirror replaces — no unknown/unknown attestation entries.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ inputs.app }}-${{ matrix.branch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}-${{ matrix.branch }}

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ${{ inputs.app }} ${{ steps.meta.outputs.app_version }}"
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  prune:
    name: prune orphaned ${{ inputs.app }} manifests
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    # One prune per package at a time: the reachable set is computed by reading
    # the registry, so a concurrent run could see a half-pushed index.
    concurrency: prune-${{ inputs.app }}
    steps:
      # Every tag is a multi-arch index, and GHCR lists that index's per-arch
      # children as their own untagged versions. Re-pushing a moving tag like
      # :latest or :8.6 leaves the old index and its children behind forever —
      # 16 had piled up under redis before this job existed.
      #
      # So "untagged" is not the same as "unused": a child is still serving
      # pulls for its architecture. Deleting untagged wholesale breaks
      # `docker pull --platform` on tags that look perfectly healthy in the UI,
      # and two indexes can share a child when only one arch was rebuilt.
      # Reachability from a tag is the only safe test.
      - name: Delete untagged manifests no tag points at
        env:
          # GITHUB_TOKEN cannot delete versions of a user-owned package, only
          # org-owned ones. These are user-owned, so this needs the PAT; the
          # job no-ops rather than failing the build when it is absent.
          GHCR_PAT: ${{ secrets.GHCR_TOKEN }}
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP: ${{ inputs.app }}
        run: |
          set -u

          if [ -z "$GHCR_PAT" ]; then
            echo "::notice::GHCR_TOKEN not set — skipping prune (needs a PAT with delete:packages)"
            exit 0
          fi

          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          repo=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')
          image="$owner/$repo/$APP"
          pkg="$repo%2F$APP"
          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'

          tok=$(curl -fsSL -u "$owner:$GHCR_PAT" \
            "https://ghcr.io/token?scope=repository:$image:pull&service=ghcr.io" | jq -r '.token')
          if [ -z "$tok" ] || [ "$tok" = "null" ]; then
            echo "::error::no registry pull token for $image"; exit 1
          fi

          manifest() {
            curl -fsSL -H "Authorization: Bearer $tok" -H "Accept: $accept" \
              "https://ghcr.io/v2/$image/manifests/$1"
          }

          keep=$(mktemp); orphans=$(mktemp)

          # An unreadable tag means the walk is incomplete, and an incomplete
          # reachable set deletes live images. Bail instead.
          for t in $(curl -fsSL -H "Authorization: Bearer $tok" \
                       "https://ghcr.io/v2/$image/tags/list" | jq -r '.tags[]?'); do
            body=$(manifest "$t")
            if [ -z "$body" ]; then
              echo "::error::cannot read tag $t — aborting before deleting anything"; exit 1
            fi
            curl -fsSI -H "Authorization: Bearer $tok" -H "Accept: $accept" \
              "https://ghcr.io/v2/$image/manifests/$t" \
              | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}' >> "$keep"
            echo "$body" | jq -r '.manifests[]?.digest' >> "$keep"
          done
          sort -u -o "$keep" "$keep"
          echo "reachable from tags: $(wc -l < "$keep")"

          versions=$(mktemp)
          if ! gh api --paginate "users/$owner/packages/container/$pkg/versions?per_page=100" > "$versions"; then
            echo "::error::cannot list versions of $repo/$APP"; exit 1
          fi

          jq -r '.[] | "\(.name) \(.id)"' "$versions" | while read -r dig id; do
            grep -qxF "$dig" "$keep" || echo "$dig $id"
          done > "$orphans"

          total=$(wc -l < "$orphans")
          if [ "$total" -eq 0 ]; then
            echo "nothing to prune"; exit 0
          fi

          # Children first: if the run dies midway, a surviving index still
          # resolves, whereas an index whose children went first does not.
          leaves=''; indexes=''
          while read -r dig id; do
            if manifest "$dig" | jq -e 'has("manifests")' >/dev/null 2>&1; then
              indexes="$indexes $id"
            else
              leaves="$leaves $id"
            fi
          done < "$orphans"

          failed=0
          for id in $leaves $indexes; do
            if gh api -X DELETE "users/$owner/packages/container/$pkg/versions/$id" >/dev/null 2>&1; then
              echo "  deleted $id"
            else
              echo "::warning::could not delete version $id"
              failed=$((failed + 1))
            fi
          done

          {
            echo "### pruned $APP"
            echo "$((total - failed)) of $total orphaned manifests deleted"
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
