name: redis

on:
  push:
    branches: [main]
    paths:
      - 'containers/redis/**'
      - '.github/workflows/redis.yml'
      - '.github/workflows/build.yml'
      - '.github/scripts/ci-published.sh'
  pull_request:
    paths:
      - 'containers/redis/**'
      - '.github/workflows/redis.yml'
      - '.github/workflows/build.yml'
      - '.github/scripts/ci-published.sh'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Version branch to build (blank = all branches present in the repo)'
        required: false
        default: ''

jobs:
  redis:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      app: redis
      branch: ${{ inputs.branch || '' }}
